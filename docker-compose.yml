# Infra local da conciliação: LocalStack (S3 + Lambda), Kafka (KRaft) e PostgreSQL.
# Subir:  docker compose up -d
# Status: docker compose ps
name: conciliacao

services:

  localstack:
    image: localstack/localstack:2026.08.5
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?defina LOCALSTACK_AUTH_TOKEN no arquivo .env}
      AWS_DEFAULT_REGION: us-east-1
      # Os containers que o LocalStack cria para executar a Lambda entram nesta rede,
      # e assim conseguem falar com o Kafka pelo nome "kafka:9092".
      LAMBDA_DOCKER_NETWORK: conciliacao-net
      # Lidas pelo script de deploy para configurar a conexão da Lambda com o Postgres.
      POSTGRES_DB: ${POSTGRES_DB:-conciliacao}
      POSTGRES_USER: ${POSTGRES_USER:-conciliacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conciliacao}
      # Onde a Lambda guarda a idempotência: postgres (padrão) ou dynamodb. Lidas pelos scripts
      # de deploy (repassa à Lambda) e de criação da tabela no DynamoDB.
      IDEMPOTENCIA_PROVEDOR: ${IDEMPOTENCIA_PROVEDOR:-postgres}
      IDEMPOTENCIA_TABELA_DYNAMO: ${IDEMPOTENCIA_TABELA_DYNAMO:-arquivo-recebido}
    volumes:
      # Necessário para o LocalStack criar os containers da Lambda.
      - /var/run/docker.sock:/var/run/docker.sock
      # Scripts executados quando o LocalStack fica pronto (bucket, deploy da Lambda).
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
      # JAR da Lambda gerado pelo Maven (deploy feito pelo script 02-deploy-lambda.sh).
      - ./conciliacao-lambda/target:/opt/lambda:ro
      # Arquivos de exemplo para upload com awslocal.
      - ./infra/exemplos:/exemplos:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      - conciliacao-net

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      # Modo KRaft: o mesmo nó é broker e controller (sem ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 24FVS0rDReSNWoKYD2SAWw
      # Dois listeners de clientes:
      #  INTERNAL (kafka:9092)     -> containers da rede Docker (Lambda, serviço batch)
      #  EXTERNAL (localhost:9094) -> aplicações rodando no host (IDE, testes)
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Nó único: fator de replicação 1 nos tópicos internos.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos são criados explicitamente pelo kafka-init; erro de digitação no nome não cria tópico novo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - conciliacao-net

  # Container de execução única: cria os tópicos e termina.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ./infra/kafka/criar-topicos.sh:/criar-topicos.sh:ro
    entrypoint: ["/bin/bash", "/criar-topicos.sh"]
    restart: "no"
    networks:
      - conciliacao-net

  postgres:
    image: postgres:18.6
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conciliacao}
      POSTGRES_USER: ${POSTGRES_USER:-conciliacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conciliacao}
    volumes:
      # No Postgres 18+ o volume é montado em /var/lib/postgresql (não mais em .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - conciliacao-net

  # Container de execução única: aplica as migrations SQL (infra/postgres/migrations) e termina.
  flyway:
    image: flyway/flyway:13.9.0-alpine
    container_name: flyway
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conciliacao}
      - -user=${POSTGRES_USER:-conciliacao}
      - -password=${POSTGRES_PASSWORD:-conciliacao}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=10
      - migrate
    volumes:
      - ./infra/postgres/migrations:/flyway/sql:ro
    restart: "no"
    networks:
      - conciliacao-net

  # Serviço de conciliação (Spring Boot + Spring Batch): consome o evento e executa o job.
  # Para rodar pelo host/IDE durante o desenvolvimento, pare este container antes
  # (docker compose stop conciliacao-batch): duas instâncias no mesmo grupo dividiriam as
  # partições, e a recuperação de jobs interrompidos assume uma instância só (ADR 0008).
  conciliacao-batch:
    build:
      context: .
      dockerfile: conciliacao-batch/Dockerfile
    image: conciliacao-batch:local
    container_name: conciliacao-batch
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conciliacao}?reWriteBatchedInserts=true
      DB_USER: ${POSTGRES_USER:-conciliacao}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-conciliacao}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      JOB_TAMANHO_CHUNK: ${JOB_TAMANHO_CHUNK:-1000}
      JOB_EXECUCOES_SIMULTANEAS: ${JOB_EXECUCOES_SIMULTANEAS:-2}
      JOB_PERCENTUAL_MAXIMO_LINHAS_INVALIDAS: ${JOB_PERCENTUAL_MAXIMO_LINHAS_INVALIDAS:-1}
      JOB_MINIMO_LINHAS_INVALIDAS: ${JOB_MINIMO_LINHAS_INVALIDAS:-100}
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    # Com ExitOnOutOfMemoryError (Dockerfile), uma falta de memória derruba a JVM e o Docker sobe
    # o container de novo; na subida, a recuperação retoma o job interrompido. Só vale quando o
    # processo morre sozinho: docker stop/kill contam como parada manual e não reiniciam.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - conciliacao-net

  # Interface web do Kafka: tópicos, mensagens, consumer groups e atraso (lag). http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: conciliacao
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xmx256m
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - conciliacao-net

  # Coleta e guarda as métricas do serviço batch (/actuator/prometheus). http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Ambiente de estudo: 7 dias de histórico bastam e limitam o disco.
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - conciliacao-net

  # Guarda os traces (spans) enviados pelo serviço batch via OTLP. Consulta pelo Grafana.
  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "4318:4318"   # OTLP/HTTP: para o batch rodando no host (IDE)
      - "3200:3200"   # API de consulta
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      # A imagem roda como o usuário 10001; o volume nomeado herda as permissões de /var/tempo.
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - conciliacao-net

  # Dashboards sobre as métricas do Prometheus. http://localhost:3000
  # Datasource e dashboard vêm de infra/grafana (provisionamento): sobem prontos, sem configurar pela tela.
  # Sem login, só leitura; para editar, entre como admin / admin (o Grafana pede para trocar a senha, dá para pular).
  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3000:3000"
    environment:
      # Acesso anônimo de leitura: aceitável só numa máquina de desenvolvimento.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Interface em português; cada usuário ainda pode trocar em Perfil > Idioma.
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/conciliacao.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - conciliacao-net

networks:
  conciliacao-net:
    # Nome fixo (sem o prefixo do projeto) para o LAMBDA_DOCKER_NETWORK encontrar a rede.
    name: conciliacao-net

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  tempo-data:
