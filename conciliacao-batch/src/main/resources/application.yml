spring:
  application:
    name: conciliacao-batch
  main:
    banner-mode: off

  datasource:
    # reWriteBatchedInserts: o driver reescreve um batch de N INSERTs em poucos INSERTs com vários
    # VALUES, o que reduz muito as idas ao banco ao gravar os resultados de cada chunk.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/conciliacao?reWriteBatchedInserts=true}
    username: ${DB_USER:conciliacao}
    password: ${DB_PASSWORD:conciliacao}
    hikari:
      # Uma conexão por job em paralelo, mais folga para o JobRepository e o health check.
      maximum-pool-size: 5

  batch:
    job:
      # Não executar jobs na subida: eles são lançados pelo consumer, um por arquivo recebido.
      enabled: false
    jdbc:
      # As tabelas do Spring Batch são criadas pelo Flyway (V2), não pela aplicação.
      initialize-schema: never

  kafka:
    # Dentro da rede Docker: kafka:9092 (3d). Rodando no host: localhost:9094.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: conciliacao-batch
      # Vale só na primeira vez que o grupo conecta; depois, ele continua do último offset confirmado.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Só considera enviado quando todas as réplicas em sincronia confirmaram (idempotência já é o padrão).
      acks: all
      properties:
        # Espera até 10 ms para juntar mais mensagens no mesmo envio: os resultados de um chunk
        # saem em poucas requisições em vez de uma por mensagem.
        linger.ms: 10
    listener:
      # Cria um span por mensagem consumida, continuando o trace do header traceparent (vindo da Lambda).
      observation-enabled: true
    # template.observation-enabled fica desligado (padrão): seria um span por resultado publicado,
    # 1 milhão num arquivo grande. A publicação já aparece dentro do span do chunk.

conciliacao:
  s3:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    regiao: ${AWS_REGION:us-east-1}
    force-path-style: ${S3_FORCE_PATH_STYLE:true}
  job:
    tamanho-chunk: ${JOB_TAMANHO_CHUNK:1000}
    execucoes-simultaneas: ${JOB_EXECUCOES_SIMULTANEAS:2}
    # O arquivo falha se as linhas inválidas passarem deste percentual das linhas lidas (mínimo tolerado: 100).
    percentual-maximo-linhas-invalidas: ${JOB_PERCENTUAL_MAXIMO_LINHAS_INVALIDAS:1}
    minimo-linhas-invalidas: ${JOB_MINIMO_LINHAS_INVALIDAS:100}

server:
  # 8080 fica para o Kafka UI (3d).
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # prometheus: coletado pelo container prometheus a cada 15 s (infra/prometheus).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    # Rótulo em todas as séries: separa este serviço de outros no mesmo Prometheus.
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        # O starter de OpenTelemetry também traz o envio de métricas por OTLP; aqui as métricas
        # continuam só no Prometheus (pull), e o OTLP fica para os traces.
        enabled: false
  tracing:
    sampling:
      # 100% dos traces: volume baixo (um trace por arquivo). Em produção com muito tráfego, amostrar.
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Grafana Tempo recebendo OTLP por HTTP. Rodando no host: http://localhost:4318/v1/traces.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    enable:
      # Leitura e processamento de cada item (linha): seriam 2 milhões de spans num arquivo de
      # 1 milhão de linhas. O detalhe fica no nível do chunk (spring.batch.chunk.write).
      # Colchetes: o nome com pontos é uma chave só (prefixo da observation), não uma hierarquia.
      "[spring.batch.item]": false

logging:
  file:
    name: logs/batch.log
  level:
    root: WARN
    br.estudo.conciliacao: INFO
    # Início e fim da aplicação ("Started BatchApplication in ...").
    org.springframework.boot.StartupInfoLogger: INFO
