# Grafana Tempo em modo monolítico (um processo só): recebe spans por OTLP e guarda em disco local.
# Consulta pelo Grafana (Explorar > Tempo); a API fica em http://localhost:3200.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # OTLP por HTTP (o que o Spring Boot usa por padrão). 4317 seria o gRPC, não exposto.
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    # Ambiente de estudo: 2 dias de traces bastam e limitam o disco.
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
