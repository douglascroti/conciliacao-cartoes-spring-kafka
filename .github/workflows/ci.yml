# Integração contínua: compila e roda todos os testes (unitários + integração com Testcontainers)
# a cada push e pull request. É o equivalente a um workflow Node com "npm ci && npm test", com a
# diferença de que os testes de integração sobem LocalStack, PostgreSQL e Kafka de verdade.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo necessário: o job só lê o código. Permissões extras são dadas por job, quando precisar.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Build, testes e scan do repositório
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # enviar o relatório do Trivy para a aba Security
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Guarda o ~/.m2 entre execuções (chave: hash dos pom.xml); só baixa o que mudou.
          cache: maven

      # verify = package (55 testes unitários) + failsafe (12 de integração, *IT).
      # O runner do GitHub já tem Docker, que o Testcontainers usa para subir os containers.
      # Sem o secret (ex.: PR vindo de fork), os testes com LocalStack são pulados, não falham.
      - name: Build e testes
        run: ./mvnw -B -ntp verify
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      # Tabela no resumo da execução. Mostra os pulados: sem o secret o CI fica verde, mas os testes
      # com LocalStack não rodaram, e isso precisa estar visível.
      - name: Resumo dos testes
        if: ${{ !cancelled() }}
        run: |
          {
            echo "| Tipo | Executados | Falhas | Erros | Pulados |"
            echo "| --- | --- | --- | --- | --- |"
            for tipo in surefire failsafe; do
              cat ./*/target/$tipo-reports/TEST-*.xml 2>/dev/null \
                | grep -o '<testsuite [^>]*>' \
                | awk -v tipo="$tipo" '
                    { for (i = 1; i <= NF; i++) { split($i, kv, "=\""); sub(/".*/, "", kv[2]); v[kv[1]] += kv[2] } }
                    END { nome = (tipo == "surefire") ? "Unitários" : "Integração";
                          printf "| %s | %d | %d | %d | %d |\n", nome, v["tests"], v["failures"], v["errors"], v["skipped"] }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Relatórios do JUnit anexados à execução, também quando algum teste falha.
      - name: Relatórios de teste
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
          if-no-files-found: ignore

      # ---- Segurança do repositório (Trivy) ----
      # Roda depois do build de propósito: o Trivy resolve as dependências dos pom.xml pelo ~/.m2 já
      # populado. Sem isso ele consulta o Maven Central para cada POM e leva bloqueio por excesso (429).
      # Varre dependências (CVEs), segredos commitados por engano e configuração (Dockerfile, compose).

      # 1) Relatório completo, todas as severidades, para a aba Security do GitHub. Nunca falha.
      - name: Trivy — relatório do repositório
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: massa
          format: sarif
          output: trivy-repositorio.sarif
          exit-code: '0'

      - name: Enviar relatório do repositório
        if: ${{ !cancelled() && hashFiles('trivy-repositorio.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-repositorio.sarif
          category: trivy-repositorio

      # 2) Barreira: falha só com CVE CRITICAL que já tem versão corrigida (ADR 0013). CVE sem
      #    correção não depende de nós; o resto fica visível no relatório acima.
      - name: Trivy — barreira de CVEs críticos (dependências)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: massa
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          # O banco de vulnerabilidades já foi baixado no passo anterior.
          skip-setup-trivy: true

  imagem:
    name: Imagem Docker, scan e publicação
    needs: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: write          # publicar no GitHub Container Registry (ghcr.io)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Mesma imagem do docker-compose (Dockerfile multi-stage). load: fica no Docker do runner para
      # o Trivy escanear. O cache de camadas (type=gha) evita refazer as dependências a cada execução.
      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: conciliacao-batch/Dockerfile
          tags: conciliacao-batch:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — relatório da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: conciliacao-batch:ci
          format: sarif
          output: trivy-imagem.sarif
          exit-code: '0'

      - name: Enviar relatório da imagem
        if: ${{ !cancelled() && hashFiles('trivy-imagem.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-imagem.sarif
          category: trivy-imagem

      - name: Trivy — barreira de CVEs críticos (imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: conciliacao-batch:ci
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      # ---- Publicação (CD): só em push na main, e só chega aqui se testes e barreiras passaram ----

      # Tags: o sha curto do commit (rastreável, imutável) e latest. Os labels OCI ligam o pacote
      # ao repositório no GitHub.
      - name: Tags e labels da imagem
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/conciliacao-batch
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # O GITHUB_TOKEN da própria execução autentica no ghcr.io: nenhum segredo a mais para guardar.
      - name: Login no ghcr.io
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesmo build do passo inicial: as camadas vêm do cache, então é rápido e gera a mesma imagem
      # que o Trivy aprovou.
      - name: Publicar imagem
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: conciliacao-batch/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
